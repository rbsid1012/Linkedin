<!doctype html><html><body>
<main><h1>Backend Engineer</h1>
<button id="open">Easy Apply</button></main>
<div role="dialog" id="dlg" style="display:none">
  <button aria-label="Dismiss" id="close">x</button>
  <div class="step" data-step="1">
    <label for="em">Email address</label>
    <select id="em"><option>Select an option</option><option>jane@example.com</option></select>
    <label for="ph">Mobile phone number</label><input id="ph" type="text" required>
    <input type="file" id="cv">
    <button onclick="go(2)">Next</button>
  </div>
  <div class="step" data-step="2" style="display:none">
    <label for="yrs">How many years of experience do you have with Python?</label>
    <input id="yrs" type="number" required>
    <fieldset><legend>Will you now or in the future require sponsorship?</legend>
      <label><input type="radio" name="sp" value="y"> Yes</label>
      <label><input type="radio" name="sp" value="n"> No</label></fieldset>
    <label for="gd">Gender</label>
    <select id="gd" required><option>Select an option</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select>
    <button onclick="go(3)">Review</button>
  </div>
  <div class="step" data-step="3" style="display:none">
    <label><input type="checkbox" id="follow" checked> Follow Acme to stay up to date with their page</label>
    <button id="submit" onclick="submitApp()">Submit application</button>
  </div>
  <div id="sent" style="display:none">Application sent</div>
</div>
<script>
 const dlg = document.getElementById('dlg');
 document.getElementById('open').onclick = () => dlg.style.display = 'block';
 document.getElementById('close').onclick = () => dlg.style.display = 'none';
 function go(n){ document.querySelectorAll('.step').forEach(s => s.style.display = s.dataset.step==n ? 'block':'none'); }
 function submitApp(){ window.__submitted = {
   phone: document.getElementById('ph').value, years: document.getElementById('yrs').value,
   sponsor: (document.querySelector('input[name=sp]:checked')||{}).value, gender: document.getElementById('gd').value,
   follow: document.getElementById('follow').checked, file: document.getElementById('cv').files.length };
   document.querySelectorAll('.step').forEach(s => s.style.display='none'); document.getElementById('sent').style.display='block'; }
</script></body></html>
